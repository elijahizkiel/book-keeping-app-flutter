name: Build and Release Android APK

on:
  pull_request: 
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release
      - name: Verify APK
        run: |  
              APK="build/app/outputs/flutter-apk/app-release.apk"

              echo "Checking APK file & size..."
              ls -lh "$APK"
          
              echo "Checking APK integrity..."
              test -f "$APK"
              unzip -t "$APK"
              BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

              "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK"
              
              echo "Checking APK signature..."
              $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)/apksigner verify --verbose "$APK"
          
              echo "Checking APK hash..."
              sha256sum "$APK"

              ls -lh "$APK"
        
      - name: Determine Release Tag & Version
        id: versioning
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=Release $VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ${{ steps.versioning.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
